server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types
    include /etc/nginx/mime.types;

    # Client-side routing (React Router fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively (e.g., index-CbW6LRcV.js)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Completely prevent index.html from being cached by browsers or reverse proxies
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Security header to prevent MIME sniffing
    add_header X-Content-Type-Options nosniff;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}